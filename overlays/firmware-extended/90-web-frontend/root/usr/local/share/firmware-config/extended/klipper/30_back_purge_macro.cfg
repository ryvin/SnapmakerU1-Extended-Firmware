[gcode_macro RESET_PURGE_LINE_STATE]
description: Reset purge line state for all extruders (call at print start)
gcode:
    SET_GCODE_VARIABLE MACRO=SM_PRINT_START_LINE_EXTRUDER_0 VARIABLE=has_finished VALUE=False
    SET_GCODE_VARIABLE MACRO=SM_PRINT_START_LINE_EXTRUDER_1 VARIABLE=has_finished VALUE=False
    SET_GCODE_VARIABLE MACRO=SM_PRINT_START_LINE_EXTRUDER_2 VARIABLE=has_finished VALUE=False
    SET_GCODE_VARIABLE MACRO=SM_PRINT_START_LINE_EXTRUDER_3 VARIABLE=has_finished VALUE=False
