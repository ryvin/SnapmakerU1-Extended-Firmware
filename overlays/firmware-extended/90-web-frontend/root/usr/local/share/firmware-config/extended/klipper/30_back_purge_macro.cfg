#
# Back Purge Line Macro for Snapmaker U1
#
# Repositions the purge line to the rear of the print plate,
# keeping it out of the way of the printed object.
#
# Credits: DocKuro (DK_PRINT_START_LINE macro)
# Source: https://gist.github.com/zero666cool/f020a233391ed03a504662a834ded16f
#
# Usage in OrcaSlicer Machine Start G-code:
#   SM_PRINT_START_LINE_EXTRUDER_0 TARGET_TEMP=[nozzle_temperature_initial_layer]
#   SM_PRINT_START_LINE_EXTRUDER_1 TARGET_TEMP=[nozzle_temperature_initial_layer]
#   (etc. for each extruder used in the print)
#

[gcode_macro DK_PRINT_START_LINE]
description: Draw a purge line at the back of the bed (internal - use SM_PRINT_START_LINE_EXTRUDER_N)
gcode:
    {% set target_temp = params.TARGET_TEMP | default(250) | int %}
    G90
    {% if printer.toolhead.extruder == 'extruder' %}
        MOVE_TO_XY_IDLE_POSITION_EXTRUDER X_OFFSET=-27 Y_OFFSET=22.5 {rawparams}
    {% else %}
        MOVE_TO_XY_IDLE_POSITION_EXTRUDER X_OFFSET=-12 Y_OFFSET=22.5 {rawparams}
    {% endif %}
    G0 Z2 F18000
    M109 S{target_temp}
    G1 Z0.2
    G91
    M83
    G1 X40 E15 F360
    G0 E-0.5
    G90
    G1 Z3

[gcode_macro SM_PRINT_START_LINE_EXTRUDER_0]
description: Draw purge line for extruder 0 (T0)
variable_has_finished: False
gcode:
    {% if has_finished == False %}
        T0 A0
        DK_PRINT_START_LINE TARGET_TEMP={params.TARGET_TEMP}
        SET_GCODE_VARIABLE MACRO=SM_PRINT_START_LINE_EXTRUDER_0 VARIABLE=has_finished VALUE=True
    {% endif %}

