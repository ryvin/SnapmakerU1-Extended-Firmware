#
# Print Photo Capture & Thumbnail Replacement
#
# Captures a webcam photo of the finished print and replaces the
# gcode file's embedded thumbnail so the touchscreen shows the
# actual printed result when browsing files.
#
# Photos are saved to a predictable location for scripted workflows:
#
#   /userdata/print_photos/<job_name>_<YYYYMMDD_HHMMSS>.jpg   (full-res)
#   /userdata/print_photos/<job_name>_<YYYYMMDD_HHMMSS>.json  (metadata)
#   /userdata/print_photos/latest.jpg                         (symlink -> newest)
#   /userdata/print_photos/latest.json                        (symlink -> newest)
#
# Requires: gcode_shell_command extension (included in this overlay)
#

# --- Shell command definition ---
[gcode_shell_command capture_print_photo]
command: /home/lava/scripts/capture_print_thumbnail.sh
timeout: 45.
verbose: True

# --- Photo capture macro ---
[gcode_macro CAPTURE_PRINT_PHOTO]
description: Capture a photo of the finished print and update gcode thumbnail
gcode:
    {% set filename = printer.print_stats.filename %}
    {% if filename %}
        { action_respond_info("Capturing print photo for: %s" % filename) }
        RUN_SHELL_COMMAND CMD=capture_print_photo PARAMS="{filename}"
    {% else %}
        { action_respond_info("No print filename available for photo capture") }
    {% endif %}

# --- PRINT_END override with photo capture ---
# Wraps the original PRINT_END to inject photo capture after parking
# the extruder but before the bed drops.
#
# Flow:
#   1. Retract filament
#   2. Raise Z 2mm (safety clearance)
#   3. Park extruder out of camera view (X5 Y5)
#   4. CAPTURE_PRINT_PHOTO (bed still at print height)
#   5. Original PRINT_END continues (Z raise to 200, heaters off, etc.)
#
[gcode_macro PRINT_END]
description: End print with photo capture
rename_existing: _PRINT_END_PHOTO_BASE
gcode:
    # Small retract to prevent oozing
    G91
    G1 E-2 F2700
    G1 Z2 F600
    G90

    # Park extruder out of internal camera view
    G1 X5 Y5 F6000

    # Capture photo while bed is still near print height
    CAPTURE_PRINT_PHOTO

    # Run the original PRINT_END for cleanup
    # (handles Z raise to 200, heaters off, steppers off, etc.)
    _PRINT_END_PHOTO_BASE {rawparams}
