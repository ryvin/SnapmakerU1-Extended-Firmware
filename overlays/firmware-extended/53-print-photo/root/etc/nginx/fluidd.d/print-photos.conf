#
# Serve print photos for dashboard access
#
# Provides HTTP access to /userdata/print_photos/ at /print_photos/
# Used by external dashboards to retrieve print completion photos.
#

location /print_photos/ {
    alias /userdata/print_photos/;
    autoindex on;
    autoindex_format json;

    # Allow cross-origin access for dashboard
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET, OPTIONS';

    # Cache static images for 5 minutes
    expires 5m;
    add_header Cache-Control "public, max-age=300";
}
